services:
  postgres:
    image: postgres:16-alpine
    container_name: nexusflow-postgres
    restart: always
    environment:
      POSTGRES_USER: dag_user
      POSTGRES_PASSWORD: dag_password_secret_2026
      POSTGRES_DB: enterprise_dag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dag_user -d enterprise_dag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nexusflow-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusflow-web
    restart: always
    # Apply the Prisma schema before serving (non-destructive; fails instead of dropping data).
    command: ["sh", "-c", "node_modules/.bin/prisma db push --skip-generate && node_modules/.bin/next start"]
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://dag_user:dag_password_secret_2026@postgres:5432/enterprise_dag?schema=public
      - REDIS_URL=redis://redis:6379
      # Local-only sample secrets — generate your own (openssl rand -hex 32) for any real deployment.
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - SESSION_SECRET=${SESSION_SECRET:-local-compose-session-secret-change-me-0123456789}
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DEMO_MODE=${DEMO_MODE:-true}
      # The worker service runs the cron scheduler.
      - SCHEDULER_ENABLED=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: nexusflow-worker
    restart: always
    environment:
      - DATABASE_URL=postgresql://dag_user:dag_password_secret_2026@postgres:5432/enterprise_dag?schema=public
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_MASTER_KEY=${ENCRYPTION_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - SESSION_SECRET=${SESSION_SECRET:-local-compose-session-secret-change-me-0123456789}
      - DEMO_MODE=${DEMO_MODE:-true}
      - SCHEDULER_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
