services:
  - type: web
    name: enterprise-dag-platform
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm db:push --skip-generate && pnpm prisma:seed && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-dag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: enterprise-dag-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Public portfolio demo: demo accounts live in an isolated workspace. Set to "false" for real use.
      - key: DEMO_MODE
        value: "true"
      # The worker below runs the cron scheduler.
      - key: SCHEDULER_ENABLED
        value: "false"
      # Set to your public URL (used for invite links and HTTPS-only headers), e.g. https://<name>.onrender.com
      - key: NEXT_PUBLIC_APP_URL
        sync: false

  - type: worker
    name: enterprise-dag-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm prisma:generate
    startCommand: pnpm worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-dag-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: enterprise-dag-redis
          property: connectionString
      - key: ENCRYPTION_MASTER_KEY
        fromService:
          type: web
          name: enterprise-dag-platform
          envVarKey: ENCRYPTION_MASTER_KEY
      - key: DEMO_MODE
        value: "true"
      - key: SCHEDULER_ENABLED
        value: "true"

databases:
  - name: enterprise-dag-postgres
    plan: free
    databaseName: enterprise_dag
    user: dag_admin

  - type: redis
    name: enterprise-dag-redis
    plan: free
    ipAllowList: []
